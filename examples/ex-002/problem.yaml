id: ex-002
title: 구별되는 부품으로 홈 채우기 — 점화식, 일반항, 홀짝과 극한
prompt: |
  길이가 $n$($n$은 음이 아닌 정수)인 일렬의 홈을 부품으로 빈틈없이 채우려고 한다.
  부품은 길이가 1인 부품 한 종류와, 길이가 2이고 서로 구별되는 부품 두 종류(A, B)가 있으며,
  각 부품은 개수에 제한 없이 사용할 수 있다. 왼쪽부터 놓인 부품의 종류나 위치가 다르면
  서로 다른 방법으로 센다. 길이가 $n$인 홈을 채우는 방법의 수를 $a_n$이라 하고,
  빈 홈($n=0$)을 채우는 방법은 한 가지로 약속한다. 즉 $a_0=1$이다.

  (1) $a_1$, $a_2$를 구하고, $n\ge 2$인 모든 정수 $n$에 대하여
  $a_n=a_{n-1}+2a_{n-2}$가 성립함을 논술하시오.

  (2) 모든 정수 $n\ge 0$에 대하여 $a_n=\dfrac{2^{n+1}+(-1)^n}{3}$임을 증명하시오.

  (3) 모든 $a_n$이 홀수임을 보이고, $\lim_{n\to\infty}\dfrac{a_n}{2^n}$의 값을 구하시오.
model_answer: |
  (1) 길이 1인 홈은 길이 1 부품 하나로만 채울 수 있으므로 $a_1=1$이다.
  길이 2인 홈은 길이 1 부품 두 개로 채우거나 A, B 중 하나로 채우므로 $a_2=3$이다.
  $n\ge 2$일 때 가장 왼쪽 부품으로 경우를 나눈다. 가장 왼쪽 부품이 길이 1이면
  남은 길이 $n-1$을 채우는 방법이 $a_{n-1}$가지이다. 길이 2이면 그 부품이 A인지 B인지에 따라
  각각 남은 길이 $n-2$를 채우는 방법이 $a_{n-2}$가지이다. 가장 왼쪽 부품은 이 셋 중
  정확히 하나이므로 세 경우는 겹치지 않고 모든 방법을 포함한다.
  따라서 $a_n=a_{n-1}+2a_{n-2}$이다. ($n=2$에서는 $a_0=1$의 약속을 쓴다.)

  (2) $b_n=\dfrac{2^{n+1}+(-1)^n}{3}$이라 하자. $b_0=\dfrac{2+1}{3}=1=a_0$,
  $b_1=\dfrac{4-1}{3}=1=a_1$이다. $n\ge 2$이고 $a_{n-1}=b_{n-1}$, $a_{n-2}=b_{n-2}$라 가정하면
  $a_n=b_{n-1}+2b_{n-2}=\dfrac{2^n+(-1)^{n-1}+2^n+2(-1)^{n-2}}{3}=\dfrac{2^{n+1}+(-1)^n}{3}=b_n$
  이다. 점화식이 앞의 두 항을 쓰므로 기저를 두 개 확인한 두 단계 귀납법에 의해
  모든 $n\ge 0$에서 $a_n=b_n$이다.

  (3) $a_0=a_1=1$은 홀수이다. $n\ge 2$에서 $a_{n-1}$이 홀수이면 $2a_{n-2}$는 짝수이므로
  $a_n=a_{n-1}+2a_{n-2}$는 홀수이다. 귀납법에 의해 모든 $a_n$은 홀수이다.
  또 $\dfrac{a_n}{2^n}=\dfrac{2}{3}+\dfrac{1}{3}\left(-\dfrac12\right)^n$이고
  $\left|\left(-\dfrac12\right)^n\right|=\dfrac{1}{2^n}\to 0$이므로 극한값은 $\dfrac23$이다.
rubric:
  - id: R1
    step: 초기값과 점화식 도출
    criteria: |
      $a_1=1$, $a_2=3$을 구하고, 가장 왼쪽(또는 가장 오른쪽) 부품으로 경우를 나누어
      $a_n=a_{n-1}+2a_{n-2}$를 얻는다. 길이 2 부품이 두 종류라서 계수가 2임을 밝히고,
      경우들이 서로 겹치지 않으며 모든 방법을 포함한다는 점을 설명한다.
    partial: |
      점화식은 맞지만 경우 분할의 근거(계수 2의 이유, 겹치지 않음, 빠짐없음)가 불충분하거나
      초기값 중 하나를 틀린 경우
  - id: R2
    step: 일반항의 증명
    criteria: |
      타당한 방법으로 일반항을 증명한다. 두 단계 귀납법을 사용하는 경우에는 기저 $n=0$, $n=1$을
      모두 확인하고, 귀납 단계에서 점화식을 이용한 대수 계산을 정확히 보인다.
    partial: |
      귀납 단계의 계산은 맞지만 기저를 하나만 확인하는 등 귀납 구조에 빈틈이 있는 경우
  - id: R3
    step: 모든 항이 홀수임을 증명
    criteria: |
      점화식에서 $2a_{n-2}$가 짝수임을 이용한 귀납, 또는 (2)의 일반항에서
      $3a_n=2^{n+1}+(-1)^n$이 홀수임을 이용하는 등 모든 $n$에 대해 성립하는 논증을 제시한다.
    partial: |
      일반 $n$에 대한 논증을 제시했으나 기저나 귀납 단계 등 일부 정당화를 생략한 경우.
      유한 개 항만 확인한 뒤 모든 항으로 일반화한 경우는 not_met이다.
  - id: R4
    step: 극한값과 그 근거
    criteria: |
      $\dfrac{a_n}{2^n}=\dfrac23+\dfrac13\left(-\dfrac12\right)^n$ 등으로 변형하고
      $\left(-\dfrac12\right)^n\to 0$의 근거를 들어 극한값 $\dfrac23$을 얻는다.
    partial: 극한값 $\dfrac23$은 맞지만 $\left(-\dfrac12\right)^n\to 0$ 등 근거를 생략한 경우
alternatives: |
  (1) 가장 오른쪽 부품으로 경우를 나누어도 인정한다.
  (2) $a_n+a_{n-1}=2(a_{n-1}+a_{n-2})$로 변형하여 $a_n+a_{n-1}=2^n$($n\ge1$)을 얻고,
  이 관계와 $a_0=1$로 수열이 하나로 정해짐을 이용해 일반항을 확인하는 풀이도 인정한다.
  특성방정식 $x^2=x+2$의 두 근 $2$, $-1$로 $a_n=\alpha 2^n+\beta(-1)^n$을 두는 풀이는,
  그 꼴이 점화식과 두 초기값을 만족하고 수열이 초기값으로 유일하게 정해짐을 밝혔을 때 인정한다.
  (3) (2)의 일반항에서 $2^{n+1}$은 짝수, $(-1)^n$은 홀수이므로 $3a_n$이 홀수이고,
  따라서 $a_n$이 홀수라고 보이는 풀이도 인정한다.
