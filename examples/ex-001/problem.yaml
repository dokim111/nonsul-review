id: ex-001
title: 도함수와 경계 조건에서 함수 결정하기
prompt: |
  모든 실수에서 미분 가능한 함수 $f$가 모든 실수 $x$에 대하여
  $f'(x)=2x$이고 $f(1)=3$을 만족한다.
  함수 $f(x)$를 구하고, 구한 함수가 두 조건을 만족하는지 확인하시오.
model_answer: |
  $f'(x)=2x$를 적분하면 $f(x)=x^2+C$이다.
  $f(1)=3$을 대입하면 $1+C=3$이므로 $C=2$이다.
  따라서 $f(x)=x^2+2$이다. 이 함수의 도함수는 $2x$이고 $f(1)=3$이므로
  주어진 두 조건을 모두 만족한다.
rubric:
  - id: R1
    step: 도함수 조건에서 함수의 관계식 도출
    criteria: |
      $f(x)=x^2+C$ 또는 $f(x)-f(1)=\int_1^x 2t\,dt=x^2-1$처럼
      도함수 조건으로부터 타당한 함수 관계식을 얻는다.
    partial: 적분의 방향은 맞지만 적분상수 또는 기준점 처리가 누락된 경우
    points: 3
  - id: R2
    step: 경계 조건을 올바르게 반영
    criteria: $f(1)=3$을 이용하여 $C=2$ 또는 이에 동치인 식을 올바르게 얻는다.
    partial: 경계 조건을 대입했지만 계산 오류로 잘못된 상수를 얻은 경우
    points: 3
  - id: R3
    step: 함수 확정 및 두 조건 검증
    criteria: $f(x)=x^2+2$를 제시하고 도함수 조건과 $f(1)=3$을 모두 확인한다.
    partial: 최종 함수는 맞지만 두 조건 중 적어도 하나의 확인을 생략한 경우
    points: 4
alternatives: |
  정적분으로 $f(x)-f(1)=\int_1^x f'(t)\,dt=x^2-1$을 얻어
  $f(x)=x^2+2$를 도출해도 모두 인정한다. 이때 별도로 적분상수 $C$를
  도입할 필요가 없다. 관계식을 처음부터 $f(x)=3+\int_1^x2t\,dt$로 써도 된다.
