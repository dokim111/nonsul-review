# Variant C: yes/no requirements per rubric item.
# role base: needed for partial credit. role full: needed (with all base) for met.
problem_id: ex-002
rubric:
  # Rubric partial: recurrence right but justification thin, OR one initial value wrong.
  R1:
    - id: R1.recurrence
      role: base
      question: "가장 왼쪽(또는 가장 오른쪽) 부품으로 경우를 나누어 a_n=a_{n-1}+2a_{n-2}를 얻었는가?"
    - id: R1.initial_any
      role: base
      question: "a_1=1과 a_2=3 중 적어도 하나를 올바르게 구했는가?"
    - id: R1.initial_both
      role: full
      question: "a_1=1과 a_2=3을 모두 올바르게 구했는가?"
    - id: R1.justify
      role: full
      question: "길이 2 부품이 두 종류라서 계수가 2라는 점과, 경우들이 겹치지 않고 빠짐없다는 점을 모두 밝혔는가?"
  R2:
    - id: R2.step
      role: base
      question: "점화식을 이용한 귀납 단계(또는 인정되는 대안 논증)의 대수 계산을 정확히 보였는가?"
    - id: R2.bases
      role: full
      question: "두 단계 귀납법이라면 기저 n=0과 n=1을 모두 확인했는가? (대안 풀이라면 수열이 하나로 정해짐을 밝혔는가?)"
  R3:
    - id: R3.general
      role: base
      question: "유한 개 항의 확인이 아니라, 모든 n에 대해 성립하는 논증(귀납 또는 일반항 이용)을 제시했는가?"
    - id: R3.complete
      role: full
      question: "그 논증의 기저와 귀납 단계 등 필요한 정당화를 빠짐없이 갖추었는가?"
  R4:
    - id: R4.value
      role: base
      question: "극한값 2/3을 얻었는가?"
    - id: R4.reason
      role: full
      question: "(-1/2)^n이 0으로 수렴한다는 근거를 제시했는가?"
