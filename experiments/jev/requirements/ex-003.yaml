problem_id: ex-003
rubric:
  R1:
    - id: R1.values
      role: base
      question: "x_1=7/4와 x_2=97/56 중 적어도 하나를 올바르게 구했는가?"
    - id: R1.both
      role: full
      question: "두 값을 모두 올바르게 구하고 계산 과정을 제시했는가?"
  R2:
    - id: R2.inequality
      role: base
      question: "x_j>√3이면 x_{j+1}>√3임을 보이는 부등식을 올바른 방향으로 제시했는가?"
    - id: R2.structure
      role: full
      question: "귀납 구조, x_j>0이라서 다음 항이 정의된다는 점, 부등호가 엄격한 이유(x_j≠√3)를 모두 밝혔는가?"
  R3:
    - id: R3.decrease
      role: base
      question: "x_{j+1}-x_j<0 등으로 수열이 감소함을 보였는가?"
    - id: R3.limit
      role: full
      question: "극한이 정확히 √3임을 점화식의 극한, 오차 상계와 샌드위치 정리, 닫힌꼴 중 하나로 결정했는가? 감소하고 √3보다 크다는 사실만으로 결론했다면 아니오."
  R4:
    - id: R4.relation
      role: base
      question: "x_{j+1}±√3의 식 등으로 q_{j+1}=q_j^2를 보였는가?"
    - id: R4.closed
      role: full
      question: "q_0=7-4√3과 지수 2^j를 사용해 q_j=(7-4√3)^{2^j} 또는 동치인 닫힌꼴을 올바르게 얻었는가?"
