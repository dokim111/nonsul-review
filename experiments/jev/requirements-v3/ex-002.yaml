# v3 (= v2 for this problem): ask WHAT was established, not HOW. Methods are examples; equivalent routes count.
# Same requirement IDs and base/full roles as v1, so v1 and v2 can be compared item by item.
problem_id: ex-002
rubric:
  R1:
    - id: R1.recurrence
      role: base
      question: "경우를 나누는 논증(가장 왼쪽 또는 가장 오른쪽 부품 등)으로 a_n=a_{n-1}+2a_{n-2}를 얻었는가?"
    - id: R1.initial_any
      role: base
      question: "a_1=1과 a_2=3 중 적어도 하나를 올바르게 구했는가?"
    - id: R1.initial_both
      role: full
      question: "a_1=1과 a_2=3을 모두 올바르게 구했는가?"
    - id: R1.justify
      role: full
      question: "계수가 2인 이유(길이 2 부품이 두 종류)와, 나눈 경우들이 겹치지 않고 빠짐없다는 점을 모두 밝혔는가?"
  R2:
    - id: R2.step
      role: base
      question: "일반항이 성립함을 보이는 핵심 계산을 정확히 제시했는가? 두 단계 귀납의 귀납 단계, a_n+a_{n-1}=2^n을 이용한 확인, 특성방정식 등 방법은 무관하다."
    - id: R2.bases
      role: full
      question: "그 증명이 모든 n≥0을 빠짐없이 덮는가? 사용한 방법에 필요한 출발 조건(두 단계 귀납이면 n=0과 n=1의 두 기저, 한 단계 관계를 쓰면 첫째 항과 수열이 하나로 정해진다는 근거 등)을 모두 갖추었는가?"
  R3:
    - id: R3.general
      role: base
      question: "유한 개 항의 확인이 아니라 모든 n에 대해 성립하는 논증을 제시했는가? 귀납, 일반항 이용 등 방법은 무관하다."
    - id: R3.complete
      role: full
      question: "그 논증에 필요한 정당화가 빠짐없는가? 귀납이면 기저와 귀납 단계, 일반항을 쓰면 그 식에서 a_n이 홀수임이 따르는 이유를 갖추었는가?"
  R4:
    - id: R4.value
      role: base
      question: "극한값 2/3을 얻었는가?"
    - id: R4.reason
      role: full
      question: "(-1/2)^n이 0으로 수렴한다는 근거를 제시했는가?"
