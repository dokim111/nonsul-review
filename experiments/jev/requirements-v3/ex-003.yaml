# v3: v2 plus rubric-boundary fixes agreed before the test run.
# R2.inequality (base) accepts a >= argument; strictness stays in R2.structure (full).
# R3.limit credits positivity or a lower bound established earlier in the answer.
problem_id: ex-003
rubric:
  R1:
    - id: R1.values
      role: base
      question: "x_1=7/4와 x_2=97/56 중 적어도 하나를 올바르게 구했는가?"
    - id: R1.both
      role: full
      question: "두 값을 모두 올바르게 구하고 계산 과정을 제시했는가? 뉴턴 방법의 식이나 변형된 점화식 중 어느 것을 써도 된다."
  R2:
    - id: R2.inequality
      role: base
      question: "x_j>√3이면 x_{j+1}이 √3 이상임을 보이는 부등식 논증을 올바른 방향으로 제시했는가? ≥로 보인 경우도 예이다(엄격성은 별도로 묻는다). 제곱식 변형, 산술평균과 기하평균의 관계 등 방법은 무관하다."
    - id: R2.structure
      role: full
      question: "귀납 구조, x_j>0이라서 다음 항이 정의된다는 점, 부등호가 엄격한 이유(x_j≠√3 또는 등호 조건의 배제)를 모두 밝혔는가?"
  R3:
    - id: R3.decrease
      role: base
      question: "x_{j+1}-x_j<0 등으로 수열이 감소함을 보였는가?"
    - id: R3.limit
      role: full
      question: "극한이 정확히 √3임을 타당한 근거로 결정했는가? 오차 상계와 샌드위치 정리, 단조수렴 정리와 극한 방정식, 닫힌꼴 등 방법은 무관하다. 극한 방정식에서 음의 근을 배제할 때 답안 앞부분에서 이미 보인 하한이나 양수성(예: 모든 j에서 x_j>√3)을 근거로 삼았다면 인정한다. 감소하고 √3보다 크다는 사실만으로 극한값을 단정했다면 아니오."
  R4:
    - id: R4.relation
      role: base
      question: "q_{j+1}=q_j^2를 보였는가?"
    - id: R4.closed
      role: full
      question: "q_j를 j에 대한 올바른 닫힌꼴로 나타냈는가? (7-4√3)^{2^j}, (2-√3)^{2^{j+1}}처럼 동치인 형태는 모두 인정한다. 지수나 q_0의 값이 틀렸다면 아니오."
