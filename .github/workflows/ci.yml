name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Offline test suite
        run: python -m pytest --cov=nonsul_review --cov-report=term-missing
      - name: Installed command smoke
        run: nonsul-review --version
      - name: Offline demo smoke
        run: >-
          nonsul-review run
          --problem examples/ex-001/problem.yaml
          --answer examples/ex-001/answers/a02.md
          --mode rubric --demo --out results/ci-demo

  quality-and-wheel:
    name: Lint, distributions, installed wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/release_check.py --dist dist
      - name: Install wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
      - name: Verify installed resources away from source checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-env/bin/python" -c 'from importlib.resources import files; import nonsul_review; p = files("nonsul_review"); assert p.joinpath("prompts/common-v1.txt").read_text(encoding="utf-8"); assert p.joinpath("demo/cases.json").read_text(encoding="utf-8"); print(nonsul_review.__version__)'
          "$RUNNER_TEMP/wheel-env/bin/nonsul-review" run --problem "$GITHUB_WORKSPACE/examples/ex-001/problem.yaml" --answer "$GITHUB_WORKSPACE/examples/ex-001/answers/a01.md" --mode free --demo --out "$RUNNER_TEMP/wheel-demo"
