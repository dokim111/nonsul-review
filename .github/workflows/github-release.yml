name: GitHub pre-release

# A tag push alone never publishes. Dispatch this only after reviewing live examples.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Verify tag and package version
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          from importlib.metadata import version
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:a[0-9]+|b[0-9]+|rc[0-9]+)?", tag):
              raise SystemExit("Invalid version tag")
          if tag != "v" + version("nonsul-review"):
              raise SystemExit("Tag and installed package version differ")
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tagged = subprocess.check_output(["git", "rev-parse", "refs/tags/" + tag + "^{commit}"], text=True).strip()
          if commit != tagged:
              raise SystemExit("Checked-out commit does not match the tag")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("commit=" + commit + "\n")
          PY
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Require reviewed public live evidence
        run: python scripts/release_check.py --dist dist --require-live --require-tracked
      - name: Stage only the reviewed release assets
        run: |
          mkdir release-assets
          cp dist/*.whl dist/*.tar.gz release-assets/
          cp docs/release-notes-v0.1.0.md release-assets/release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure required reviewers and allowed branches/tags in repository Settings.
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-release-assets
          path: release-assets/
      - name: Verify remote tag still points to tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          actual_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          test "$actual_commit" = "$EXPECTED_COMMIT"
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG"
          release-assets/*.whl release-assets/*.tar.gz
          --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false
          --title "nonsul-review $RELEASE_TAG (pre-release)"
          --notes-file release-assets/release-notes.md
